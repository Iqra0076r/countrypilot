name: Semrush final document-structure QA

on:
  push:
    paths:
      - '.github/workflows/semrush-finalize-doctype.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore missing doctypes and validate document starts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = 0
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','dist','build'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if text.startswith('\ufeff'):
                  bom='\ufeff'
                  body=text[1:]
              else:
                  bom=''
                  body=text
              if re.match(r'^\s*<html\b', body, re.I):
                  body = re.sub(r'^\s*<html\b', '<!doctype html><html', body, count=1, flags=re.I)
                  p.write_text(bom + body, encoding='utf-8')
                  changed += 1

          print(f'Files restored with doctype: {changed}')

          malformed=[]
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','dist','build'} for part in p.parts):
                  continue
              try:
                  text=p.read_text(encoding='utf-8').lstrip('\ufeff \t\r\n')
              except UnicodeDecodeError:
                  continue
              if not re.match(r'^<!doctype html>\s*<html\b', text, re.I):
                  malformed.append((str(p), text[:120].replace('\n',' ')))
                  if len(malformed) >= 30:
                      break
          if malformed:
              raise SystemExit('HTML documents with nonstandard starts remain: ' + repr(malformed))
          PY
      - name: Commit repairs and remove one-time workflow
        run: |
          git config user.name "CountryPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/semrush-finalize-doctype.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Semrush final QA: restore HTML doctypes sitewide"
          git push
