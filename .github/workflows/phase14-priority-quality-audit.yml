name: Phase 14 priority quality audit
# registered trigger

on:
  push:
    paths:
      - '.github/workflows/phase14-priority-quality-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit 59 priority URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, itertools
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          sm=Path('sitemap-priority.xml')
          root=ET.parse(sm).getroot()
          urls=[e.text.strip() for e in root.findall('.//{*}loc') if e.text]
          assert len(urls)==59, f'Expected 59 priority URLs, got {len(urls)}'

          def path_for(url):
              p=urlparse(url).path.strip('/')
              return Path('index.html') if not p else Path(p)/'index.html'

          def clean_text(src):
              src=re.sub(r'<script\b[^>]*>[\s\S]*?</script>',' ',src,flags=re.I)
              src=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',' ',src,flags=re.I)
              src=re.sub(r'<[^>]+>',' ',src)
              src=html.unescape(src)
              return re.sub(r'\s+',' ',src).strip()

          def title(src):
              m=re.search(r'<title>([\s\S]*?)</title>',src,re.I)
              return clean_text(m.group(1)) if m else ''

          def h1(src):
              m=re.search(r'<h1\b[^>]*>([\s\S]*?)</h1>',src,re.I)
              return clean_text(m.group(1)) if m else ''

          def canonical(src):
              m=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',src,re.I)
                 or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical',src,re.I))
              return m.group(1).strip() if m else ''

          def robots(src):
              m=(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)',src,re.I)
                 or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']robots',src,re.I))
              return m.group(1).strip() if m else ''

          stop={'the','and','for','with','from','that','this','your','you','are','can','will','into','our','not','use','before','after','about','guide','country','pilot'}
          def shingles(text,n=5):
              words=[w for w in re.findall(r'[a-z0-9]+',text.lower()) if w not in stop]
              if len(words)<n:return set(words)
              return {' '.join(words[i:i+n]) for i in range(len(words)-n+1)}

          rows=[]
          docs={}
          problems=[]
          for url in urls:
              p=path_for(url)
              if not p.exists():
                  rows.append((url,str(p),'MISSING',0,'','','','',''))
                  problems.append(f'MISSING FILE: {url} -> {p}')
                  continue
              src=p.read_text(encoding='utf-8',errors='replace')
              txt=clean_text(src)
              wc=len(re.findall(r"\b\w+[\w'-]*\b",txt))
              t=title(src); hh=h1(src); can=canonical(src); rob=robots(src)
              doctype=bool(re.match(r'^\s*<!doctype html>',src,re.I))
              noindex=bool(re.search(r'\bnoindex\b',rob,re.I))
              internal=len(re.findall(r'href=["\'](?:/|\.\.?/)',src,re.I))
              ext=len(re.findall(r'href=["\']https?://',src,re.I))
              status='OK'
              flags=[]
              if not doctype: flags.append('missing-doctype')
              if noindex: flags.append('noindex')
              if can!=url: flags.append('canonical-mismatch')
              if not t: flags.append('missing-title')
              if not hh: flags.append('missing-h1')
              if wc<500: flags.append('low-word-count')
              if internal<3: flags.append('weak-internal-links')
              if flags:
                  status=';'.join(flags)
                  problems.append(f'{url}: {status}')
              rows.append((url,str(p),status,wc,len(t),len(hh),internal,ext,can))
              docs[url]=(txt,shingles(txt))

          similar=[]
          for (u1,(t1,s1)),(u2,(t2,s2)) in itertools.combinations(docs.items(),2):
              if not s1 or not s2: continue
              j=len(s1&s2)/len(s1|s2)
              if j>=0.55:
                  similar.append((j,u1,u2))
          similar.sort(reverse=True)

          out=Path('docs/phase-14-priority-quality-audit.md')
          lines=[
            '# Phase 14 — Priority URL Quality Audit',
            '',
            '**Generated:** 2026-10-07',
            f'**URLs audited:** {len(urls)}',
            f'**Structural/content flags:** {len(problems)}',
            f'**Near-duplicate pairs at Jaccard >= 0.55:** {len(similar)}',
            '',
            '## URL audit',
            '',
            '| URL | Status | Words | Title chars | H1 chars | Internal hrefs | External hrefs |',
            '|---|---|---:|---:|---:|---:|---:|'
          ]
          for url,p,status,wc,tl,hl,internal,ext,can in rows:
              lines.append(f'| {url} | {status} | {wc} | {tl} | {hl} | {internal} | {ext} |')
          lines += ['', '## Near-duplicate pairs', '']
          if similar:
              lines += ['| Jaccard | URL A | URL B |','|---:|---|---|']
              for j,u1,u2 in similar[:50]:
                  lines.append(f'| {j:.3f} | {u1} | {u2} |')
          else:
              lines.append('None at the configured threshold.')
          lines += ['', '## Flags', '']
          lines += [f'- {x}' for x in problems] if problems else ['No structural/content-depth flags under the configured checks.']
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines[:20]))
          PY
      - name: Commit report and remove one-time workflow
        run: |
          git config user.name "CountryPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/phase14-priority-quality-audit.yml
          git add docs/phase-14-priority-quality-audit.md
          git commit -m "Phase 14: audit priority pages for indexing quality"
          git push
