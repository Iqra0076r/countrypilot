name: Mobile UI visual QA

on:
  push:
    paths:
      - '.github/workflows/mobile-ui-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for live mobile CSS deployment
        run: |
          python - <<'PY'
          import time, urllib.request, sys
          url='https://countrypilot.info/?mobileqa=20261007b'
          for i in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      s=r.read().decode('utf-8','replace')
                  if 'countrypilot-premium.css?v=20261007-mobile1' in s:
                      print('Live deployment detected on attempt', i+1)
                      break
              except Exception as e:
                  print('attempt',i+1,'error',e)
              if i==17:
                  print('New CSS version not live yet')
                  sys.exit(1)
              time.sleep(10)
          PY

      - name: Install Selenium
        run: |
          python -m pip install --quiet selenium

      - name: Capture and assert mobile layouts
        run: |
          mkdir -p qa/mobile
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from pathlib import Path
          import json, time, sys

          def run(width, height, label):
              o=Options()
              o.add_argument('--headless=new')
              o.add_argument('--no-sandbox')
              o.add_argument('--disable-dev-shm-usage')
              o.add_argument(f'--window-size={width},{height}')
              o.add_argument('--force-device-scale-factor=1')
              d=webdriver.Chrome(options=o)
              d.set_window_size(width,height)
              d.get('https://countrypilot.info/?mobileqa=20261007b')
              time.sleep(2.5)

              metrics=d.execute_script("""
                const q=s=>document.querySelector(s);
                const r=e=>e?e.getBoundingClientRect():null;
                const nav=q('.nav-menu'), feed=q('.latest-feed'), countries=q('.country-grid');
                const firstFeed=q('.latest-feed .editorial-card');
                const firstFeedImage=q('.latest-feed .editorial-card .card-image');
                const firstCountry=q('.country-card.country-photo');
                const firstCountryMedia=q('.country-card.country-photo .country-media');
                const firstCountryCopy=q('.country-card.country-photo .country-copy');
                return {
                  innerWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  nav:r(nav),
                  feed:r(feed),
                  firstFeed:r(firstFeed),
                  firstFeedImageDisplay:firstFeedImage?getComputedStyle(firstFeedImage).display:null,
                  countries:r(countries),
                  countryGridCols:countries?getComputedStyle(countries).gridTemplateColumns:null,
                  firstCountry:r(firstCountry),
                  firstCountryMedia:r(firstCountryMedia),
                  firstCountryCopy:r(firstCountryCopy)
                };
              """)

              errors=[]
              if metrics['scrollWidth'] > metrics['innerWidth'] + 1:
                  errors.append(f"horizontal overflow {metrics['scrollWidth']} > {metrics['innerWidth']}")
              nav=metrics['nav']
              if not nav or nav['left'] < -1 or nav['right'] > metrics['innerWidth']+1:
                  errors.append(f"nav menu outside viewport: {nav}")
              if metrics['firstFeedImageDisplay'] != 'none':
                  errors.append(f"priority guide image not hidden: {metrics['firstFeedImageDisplay']}")
              if metrics['countryGridCols'] and ' ' in metrics['countryGridCols'].strip():
                  errors.append(f"country grid still multi-column: {metrics['countryGridCols']}")
              cm=metrics['firstCountryMedia']; cc=metrics['firstCountryCopy']
              if cm and cc and cm['right'] > cc['left'] + 1:
                  errors.append(f"country media/copy overlap: media right {cm['right']}, copy left {cc['left']}")

              d.save_screenshot(f'qa/mobile/{label}-top.png')

              d.execute_script("document.querySelector('.latest-feed').scrollIntoView({block:'start'});")
              time.sleep(.6)
              d.save_screenshot(f'qa/mobile/{label}-priority.png')

              d.execute_script("document.querySelector('.country-grid').scrollIntoView({block:'start'});")
              time.sleep(.6)
              d.save_screenshot(f'qa/mobile/{label}-destinations.png')

              Path(f'qa/mobile/{label}-metrics.json').write_text(json.dumps(metrics,indent=2),encoding='utf-8')
              d.quit()
              return errors, metrics

          failures=[]
          for w,h,label in [(690,1516,'690x1516'),(390,844,'390x844')]:
              errors,metrics=run(w,h,label)
              print(label,json.dumps(metrics,indent=2))
              failures.extend([label+': '+e for e in errors])

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('Mobile visual QA assertions passed.')
          PY

      - name: Commit QA evidence and remove workflow
        run: |
          git config user.name "CountryPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/mobile-ui-qa.yml
          git add qa/mobile
          git commit -m "Verify CountryPilot mobile UI fixes"
          git push
