name: Mobile UI hotfix

on:
  push:
    paths:
      - '.github/workflows/mobile-ui-hotfix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile layout fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/countrypilot-premium.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* CountryPilot mobile UI closeout — 2026-10-07 */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n\n'

          hotfix = r'''
          /* CountryPilot mobile UI closeout — 2026-10-07 */
          @media (max-width:820px){
            html,body{max-width:100%!important;overflow-x:hidden!important}

            /* Header/navigation: compact, fully inside viewport, no clipped Menu label. */
            .masthead{padding:8px 0 7px!important}
            .masthead-inner{min-height:0!important}
            .site-nav{min-height:46px!important}
            .site-nav .nav-inner{
              width:calc(100% - 20px)!important;
              max-width:none!important;
              min-height:46px!important;
              height:46px!important;
              margin-inline:auto!important;
              padding:0!important;
              justify-content:flex-end!important;
              overflow:visible!important
            }
            .nav-scroll{display:none!important}
            .nav-menu{
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:44px!important;
              min-width:44px!important;
              max-width:44px!important;
              height:40px!important;
              min-height:40px!important;
              flex:0 0 44px!important;
              margin:0!important;
              padding:0!important;
              border-radius:11px!important;
              overflow:hidden!important
            }
            .nav-menu>span:last-child{display:none!important}
            .nav-menu .menu-icon{
              display:block!important;
              margin:0!important;
              font-size:22px!important;
              line-height:1!important
            }
            .mobile-nav{
              top:46px!important;
              max-height:calc(100dvh - 46px)!important
            }

            /* Priority Guides: mobile becomes a clean text-first list.
               Removes image/text collisions and improves scan speed. */
            .latest-feed .editorial-card{
              display:block!important;
              width:100%!important;
              min-width:0!important;
              margin:0!important;
              padding:16px 0!important;
              border-bottom:1px solid var(--cp-line,#d8e2ec)!important;
              background:#fff!important
            }
            .latest-feed .editorial-card .card-image{
              display:none!important;
              width:0!important;
              height:0!important;
              min-height:0!important
            }
            .latest-feed .editorial-card .card-copy{
              display:block!important;
              position:relative!important;
              z-index:2!important;
              width:100%!important;
              min-width:0!important;
              margin:0!important;
              padding:0!important;
              background:#fff!important;
              overflow:visible!important
            }
            .latest-feed .card-copy .eyebrow{
              margin:0 0 5px!important;
              font-size:10px!important;
              line-height:1.3!important;
              letter-spacing:.09em!important
            }
            .latest-feed .card-copy h3{
              margin:0 0 7px!important;
              font-size:19px!important;
              line-height:1.22!important;
              overflow-wrap:anywhere!important
            }
            .latest-feed .card-copy p{
              display:-webkit-box!important;
              -webkit-line-clamp:2!important;
              -webkit-box-orient:vertical!important;
              overflow:hidden!important;
              margin:0 0 8px!important;
              font-size:13px!important;
              line-height:1.5!important
            }
            .latest-feed .card-meta{
              display:flex!important;
              gap:8px 12px!important;
              font-size:10px!important
            }

            /* Popular destinations: replace text-heavy artwork with a compact
               mobile identity rail while preserving the actual country text. */
            .cp-home .country-grid{
              display:grid!important;
              grid-template-columns:1fr!important;
              gap:12px!important
            }
            .cp-home .country-card.country-photo{
              display:grid!important;
              grid-template-columns:96px minmax(0,1fr)!important;
              align-items:stretch!important;
              min-height:112px!important;
              height:auto!important;
              padding:0!important;
              border:1px solid var(--cp-line,#d8e2ec)!important;
              border-top:3px solid var(--cp-blue,#0963ad)!important;
              border-radius:14px!important;
              background:#fff!important;
              color:var(--cp-ink,#142638)!important;
              overflow:hidden!important;
              box-shadow:none!important
            }
            .cp-home .country-card .country-media{
              position:relative!important;
              inset:auto!important;
              width:96px!important;
              height:100%!important;
              min-height:109px!important;
              aspect-ratio:auto!important;
              overflow:hidden!important;
              background:
                radial-gradient(circle at 78% 18%,rgba(255,255,255,.16),transparent 23%),
                linear-gradient(145deg,#0b679f,#082f4f)!important
            }
            .cp-home .country-card .country-media img{display:none!important}
            .cp-home .country-card .country-media .media-fallback{
              position:absolute!important;
              inset:auto 10px 11px 10px!important;
              display:block!important;
              width:auto!important;
              height:auto!important;
              padding:0!important;
              background:none!important;
              color:#fff!important;
              font-size:10.5px!important;
              line-height:1.15!important;
              font-weight:850!important;
              text-align:left!important;
              overflow-wrap:anywhere!important
            }
            .cp-home .country-card .country-media::before{
              content:"CP";
              position:absolute;
              top:10px;
              right:10px;
              color:rgba(255,255,255,.78);
              font-size:15px;
              line-height:1;
              font-weight:950;
              letter-spacing:-.08em
            }
            .cp-home .country-card .country-overlay{display:none!important}
            .cp-home .country-card .country-copy{
              position:static!important;
              inset:auto!important;
              align-self:center!important;
              min-width:0!important;
              padding:14px 15px!important;
              color:var(--cp-ink,#142638)!important
            }
            .cp-home .country-card .country-copy .eyebrow{
              color:var(--cp-blue,#0963ad)!important;
              font-size:9px!important;
              line-height:1.3!important;
              letter-spacing:.1em!important
            }
            .cp-home .country-card .country-copy h3{
              margin:4px 0 5px!important;
              color:var(--cp-navy,#082f4f)!important;
              font-family:var(--cp-sans,Inter,system-ui,sans-serif)!important;
              font-size:20px!important;
              line-height:1.15!important;
              font-weight:850!important;
              letter-spacing:-.025em!important;
              overflow-wrap:anywhere!important
            }
            .cp-home .country-card .country-copy p{
              margin:0!important;
              color:var(--cp-muted,#607080)!important;
              font-size:12.5px!important;
              line-height:1.45!important
            }

            /* Headings should wrap naturally rather than force oversized rows. */
            .section-head.editorial{
              min-width:0!important;
              gap:10px!important
            }
            .section-head.editorial>div{min-width:0!important}
            .section-head.editorial h2{
              max-width:100%!important;
              overflow-wrap:anywhere!important
            }
          }

          @media (max-width:520px){
            .publication-brand{font-size:24px!important}
            .publication-brand img,.publication-brand .brand-mark{
              width:38px!important;
              height:38px!important;
              flex-basis:38px!important
            }
            .latest-feed .card-copy h3{font-size:17px!important}
            .latest-feed .card-copy p{-webkit-line-clamp:2!important}
            .cp-home .country-card.country-photo{
              grid-template-columns:82px minmax(0,1fr)!important;
              min-height:104px!important
            }
            .cp-home .country-card .country-media{
              width:82px!important;
              min-height:101px!important
            }
            .cp-home .country-card .country-copy{padding:12px 13px!important}
            .cp-home .country-card .country-copy h3{font-size:18px!important}
            .cp-home .country-card .country-copy p{font-size:12px!important}
          }
          '''
          css_path.write_text(css + hotfix.strip() + '\n', encoding='utf-8')

          # Cache-bust the premium stylesheet everywhere so mobile browsers
          # do not keep the broken 2026-10-06 CSS.
          changed = 0
          for p in Path('.').rglob('*.html'):
              src = p.read_text(encoding='utf-8', errors='replace')
              new = re.sub(
                  r'/assets/countrypilot-premium\.css\?v=[^"\']+',
                  '/assets/countrypilot-premium.css?v=20261007-mobile1',
                  src
              )
              if new != src:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
          print('HTML cache-bust files changed:', changed)
          PY

      - name: Validate mobile CSS and HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          css = Path('assets/countrypilot-premium.css').read_text(encoding='utf-8')
          required = [
              'CountryPilot mobile UI closeout — 2026-10-07',
              '.nav-menu>span:last-child',
              '.latest-feed .editorial-card .card-image',
              '.cp-home .country-card.country-photo',
              'grid-template-columns:1fr!important'
          ]
          missing = [x for x in required if x not in css]
          if missing:
              print('Missing CSS controls:', missing)
              sys.exit(1)

          htmls = list(Path('.').rglob('*.html'))
          stale = []
          for p in htmls:
              s = p.read_text(encoding='utf-8', errors='replace')
              if '/assets/countrypilot-premium.css' in s and 'countrypilot-premium.css?v=20261007-mobile1' not in s:
                  stale.append(str(p))
          if stale:
              print('Stale premium CSS refs:', stale[:30])
              sys.exit(1)

          home = Path('index.html').read_text(encoding='utf-8')
          for token in ['latest-feed','country-grid','nav-menu','cp-home']:
              if token not in home:
                  print('Homepage missing token:', token)
                  sys.exit(1)

          print('Mobile UI validation passed across', len(htmls), 'HTML files')
          PY

      - name: Commit fixes and remove workflow
        run: |
          git config user.name "CountryPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/mobile-ui-hotfix.yml
          git add assets/countrypilot-premium.css .
          git commit -m "Fix CountryPilot mobile layout collisions"
          git push
