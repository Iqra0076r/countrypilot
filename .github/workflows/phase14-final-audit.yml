name: Phase 14 final quality audit
# registered trigger

on:
  push:
    paths:
      - '.github/workflows/phase14-final-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, itertools
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET
          root=ET.parse('sitemap-priority.xml').getroot()
          urls=[e.text.strip() for e in root.findall('.//{*}loc') if e.text]
          assert len(urls)==59
          stop={'the','and','for','with','from','that','this','your','you','are','can','will','into','our','not','use','before','after','about','guide','country','pilot'}
          def pfor(u):
              p=urlparse(u).path.strip('/')
              return Path(p)/'index.html' if p else Path('index.html')
          def clean(s):
              s=re.sub(r'<script\b[^>]*>[\s\S]*?</script>',' ',s,flags=re.I)
              s=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',' ',s,flags=re.I)
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'\s+',' ',html.unescape(s)).strip()
          def sh(t,n=5):
              w=[x for x in re.findall(r'[a-z0-9]+',t.lower()) if x not in stop]
              return {' '.join(w[i:i+n]) for i in range(max(0,len(w)-n+1))}
          rows=[]; docs={}; flags=[]
          for u in urls:
              p=pfor(u)
              if not p.exists():
                  flags.append(f'MISSING: {u}'); rows.append((u,'MISSING',0)); continue
              src=p.read_text(encoding='utf-8',errors='replace'); txt=clean(src)
              wc=len(re.findall(r"\b\w+[\w'-]*\b",txt))
              can=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',src,re.I) or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical',src,re.I))
              rob=(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)',src,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']robots',src,re.I))
              bad=[]
              if wc<500: bad.append('low-word-count')
              if rob and re.search(r'\bnoindex\b',rob.group(1),re.I): bad.append('noindex')
              if not can or can.group(1).strip()!=u: bad.append('canonical-mismatch')
              if not re.match(r'^\s*<!doctype html>',src,re.I): bad.append('missing-doctype')
              if not re.search(r'<title>[^<]{5,}</title>',src,re.I): bad.append('missing-title')
              if not re.search(r'<h1\b[^>]*>[\s\S]*?</h1>',src,re.I): bad.append('missing-h1')
              status=';'.join(bad) if bad else 'OK'
              if bad: flags.append(f'{u}: {status}')
              rows.append((u,status,wc))
              docs[u]=sh(txt)
          sims=[]
          for a,b in itertools.combinations(urls,2):
              A,B=docs.get(a,set()),docs.get(b,set())
              if not A or not B: continue
              inter=len(A&B); union=len(A|B); j=inter/union if union else 0
              if j>=0.55:sims.append((j,a,b))
          sims.sort(reverse=True)
          lines=['# Phase 14 — Priority URL Quality Audit','',
                 '**Generated:** 2026-10-07 (post-fix final audit)',
                 f'**URLs audited:** {len(urls)}',
                 f'**Structural/content flags:** {len(flags)}',
                 f'**Near-duplicate pairs at Jaccard >= 0.55:** {len(sims)}','',
                 '## URL audit','','| URL | Status | Words |','|---|---|---:|']
          for u,s,w in rows: lines.append(f'| {u} | {s} | {w} |')
          lines += ['','## Near-duplicate pairs','']
          if sims:
              lines += ['| Jaccard | URL A | URL B |','|---:|---|---|']
              for j,a,b in sims[:50]:lines.append(f'| {j:.3f} | {a} | {b} |')
          else: lines.append('None at or above the configured threshold.')
          lines += ['','## Flags','']+([f'- {x}' for x in flags] if flags else ['No structural/content-depth flags under the configured checks.'])
          Path('docs/phase-14-priority-quality-audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(f'FINAL flags={len(flags)} near_duplicates={len(sims)}')
          PY
      - name: Commit and self-remove
        run: |
          git config user.name "CountryPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/phase14-final-audit.yml
          git add docs/phase-14-priority-quality-audit.md
          git commit -m "Phase 14: finalize clean 59-page quality audit"
          git push
