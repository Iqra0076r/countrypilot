name: Apply CountryPilot premium UI

on:
  push:
    branches:
      - site-quality-5000-ui
    paths:
      - "scripts/premiumize_site.py"
      - "scripts/validate_site_quality.py"
      - "assets/countrypilot-premium.css"
      - ".github/workflows/apply-premium-ui.yml"

permissions:
  contents: write

jobs:
  premiumize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: site-quality-5000-ui
          fetch-depth: 0

      - name: Apply presentation refactor
        run: python3 scripts/premiumize_site.py

      - name: Validate core files
        run: |
          test -s assets/countrypilot-core.css
          test -s assets/countrypilot-premium.css
          test -s SITE_QUALITY_5000_AUDIT.json
          grep -q "/assets/countrypilot-core.css" index.html
          grep -q "/assets/countrypilot-premium.css" index.html
          grep -q "fetch('/data/content-index.json'" search/index.html

      - name: Run full site integrity validation
        run: python3 scripts/validate_site_quality.py

      - name: Commit generated site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Validate premium UI refactor [skip ci]"
            git push origin HEAD:site-quality-5000-ui
          fi
